name: Deploy B.I.L.Q.I.S. OS to GitHub Pages

# Publishes the site by syncing this branch's content to the gh-pages
# branch, which GitHub Pages serves. (The actions/deploy-pages route needs
# the Pages source set to "GitHub Actions" in repo settings, which the
# workflow token cannot change itself.)

on:
  push:
    branches: [claude/jarvis-operating-system-j828ty]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site to gh-pages
        run: |
          rm -rf .github
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
          git push origin gh-pages-tmp:gh-pages --force
